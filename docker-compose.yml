x-env: &env
    MONGO_HOST: ${MONGO_HOST:-mongo}
    MONGO_PORT: ${MONGO_PORT:-27017}
    MONGO_USER: ${MONGO_USER:-admin}
    MONGO_PASS: ${MONGO_PASS:-admin}
    MONGO_NAME: ${MONGO_NAME:-bot}
    MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
    MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-admin}

services:
    app:
        build: .
        restart: on-failure
        depends_on:
            - redis
            - mongo
        environment:
            TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
            RD_DB: ${RD_DB:-5}
            RD_HOST: ${RD_HOST:-redis}
            RD_PORT: ${RD_PORT:-6379}
            API_PORT: ${API_PORT:-8989}
            WEBHOOK_URL: https://bot.azcity.uz/webhook
            <<: *env

            PYTHONUNBUFFERED: "1"

        entrypoint:
            - ./bin/entrypoint.sh
        volumes:
            - .:/app
            - ./logs:/app/logs

        command: >
            uvicorn app.main:app
            --host 0.0.0.0
            --port 8989
            --reload
        expose:
            - "8989"
        networks:
            - default
            - traefik-public
        labels:
            - "traefik.enable=true"
            # Marketing website — azcity.uz / www.azcity.uz (everything except the bot webhook)
            - "traefik.http.routers.azcityweb.rule=(Host(`azcity.uz`) || Host(`www.azcity.uz`)) && !PathPrefix(`/webhook`)"
            - "traefik.http.routers.azcityweb.entrypoints=https"
            - "traefik.http.routers.azcityweb.tls.certresolver=le"
            - "traefik.http.routers.azcityweb.service=azcitybot"
            # Telegram webhook — bot.azcity.uz (webhook endpoint only)
            - "traefik.http.routers.azcitybot.rule=Host(`bot.azcity.uz`) && PathPrefix(`/webhook`)"
            - "traefik.http.routers.azcitybot.entrypoints=https"
            - "traefik.http.routers.azcitybot.tls.certresolver=le"
            - "traefik.http.routers.azcitybot.service=azcitybot"
            - "traefik.http.services.azcitybot.loadbalancer.server.port=8989"
            - "traefik.docker.network=traefik-public"

    redis:
        image: redis:alpine
        restart: unless-stopped
        command: redis-server --appendonly yes
        ports:
            - "6379:6379"
        environment:
            - REDIS_REPLICATION_MODE=master
        volumes:
            - redis:/data
    mongo:
        image: mongo
        restart: always
        ports:
            - "27017:27017"
        environment:
            <<: *env
        volumes:
            - mongo_db:/data/db

volumes:
    mongo_db:
    redis:

networks:
    traefik-public:
        external: true
